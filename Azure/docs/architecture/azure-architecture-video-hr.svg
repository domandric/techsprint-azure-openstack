<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Azure TechSprint shared hub and isolated developer spokes</title>
  <desc id="desc">A shared GeneralPurpose ZoneRedundant MySQL server serves one database, user, and grant per developer. Legacy tenant MySQL subnets remain reserved and unused.</desc>
  <rect width="1920" height="1080" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#12233b">
    <text x="960" y="70" text-anchor="middle" font-size="34" font-weight="bold">Azure TechSprint · shared HA MySQL topology</text>
    <rect x="90" y="130" width="1740" height="300" rx="20" fill="#f7faff" stroke="#527da6" stroke-width="3"/>
    <text x="120" y="175" font-size="28" font-weight="bold">SHARED HUB · private network 10.10.0.0/16</text>
    <rect x="150" y="220" width="330" height="130" rx="12" fill="#e8f1fb" stroke="#2f6fad"/>
    <text x="315" y="270" text-anchor="middle" font-size="24">Jump + private</text>
    <text x="315" y="305" text-anchor="middle" font-size="24">Application Gateway</text>
    <rect x="560" y="205" width="700" height="165" rx="12" fill="#eef7f1" stroke="#3c8760" stroke-width="2"/>
    <text x="910" y="245" text-anchor="middle" font-size="27" font-weight="bold">MySQL 8.4 · GP_Standard_D2ds_v4</text>
    <text x="910" y="282" text-anchor="middle" font-size="24">GeneralPurpose · ZoneRedundant · zones 1/2</text>
    <text x="910" y="319" text-anchor="middle" font-size="24">Private Access · hub subnet 10.10.3.0/24</text>
    <text x="910" y="350" text-anchor="middle" font-size="21">moodle_&lt;slug&gt; database / account / grant per developer</text>
    <rect x="1340" y="220" width="390" height="130" rx="12" fill="#e8f1fb" stroke="#2f6fad"/>
    <text x="1535" y="270" text-anchor="middle" font-size="24">Private DNS</text>
    <text x="1535" y="305" text-anchor="middle" font-size="22">reconciled after tenants</text>
    <path d="M480 285H560M1260 285H1340" stroke="#526b84" stroke-width="4"/>
    <rect x="90" y="510" width="820" height="370" rx="20" fill="#f7faff" stroke="#527da6" stroke-width="3"/>
    <rect x="1010" y="510" width="820" height="370" rx="20" fill="#f7faff" stroke="#527da6" stroke-width="3"/>
    <text x="120" y="555" font-size="27" font-weight="bold">DEVELOPER A · isolated spoke</text>
    <text x="1040" y="555" font-size="27" font-weight="bold">DEVELOPER N · isolated spoke</text>
    <text x="140" y="625" font-size="23">app01 zone 1 · app02 zone 2</text>
    <text x="140" y="665" font-size="23">Azure Files + Blob private endpoints</text>
    <text x="140" y="705" font-size="23">own moodle_&lt;slug&gt; DB/user/grant</text>
    <text x="1060" y="625" font-size="23">app01 zone 1 · app02 zone 2</text>
    <text x="1060" y="665" font-size="23">Azure Files + Blob private endpoints</text>
    <text x="1060" y="705" font-size="23">own moodle_&lt;slug&gt; DB/user/grant</text>
    <path d="M720 370V510M1200 370V510" stroke="#526b84" stroke-width="4"/>
    <text x="960" y="955" text-anchor="middle" font-size="22">Reserved legacy tenant MySQL subnets remain unused for migration compatibility · no Redis</text>
  </g>
</svg>
