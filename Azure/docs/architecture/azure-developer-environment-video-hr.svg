<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">One developer environment using the shared HA MySQL server</title>
  <desc id="desc">Two private application VMs use their own database, account, and grant on the shared ZoneRedundant MySQL server.</desc>
  <rect width="1920" height="1080" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#12233b">
    <text x="960" y="75" text-anchor="middle" font-size="34" font-weight="bold">One developer · shared HA MySQL dependency</text>
    <rect x="100" y="140" width="1720" height="270" rx="20" fill="#f7faff" stroke="#527da6" stroke-width="3"/>
    <text x="135" y="185" font-size="28" font-weight="bold">PRIVATE APPLICATION SPOKE</text>
    <rect x="180" y="230" width="360" height="115" rx="12" fill="#e8f1fb" stroke="#2f6fad"/>
    <text x="360" y="277" text-anchor="middle" font-size="25">app01 · zone 1</text>
    <text x="360" y="315" text-anchor="middle" font-size="22">Rocky Linux 10 · 2 vCPU · 4 GiB</text>
    <rect x="620" y="230" width="360" height="115" rx="12" fill="#e8f1fb" stroke="#2f6fad"/>
    <text x="800" y="277" text-anchor="middle" font-size="25">app02 · zone 2</text>
    <text x="800" y="315" text-anchor="middle" font-size="22">Rocky Linux 10 · 2 vCPU · 4 GiB</text>
    <rect x="1080" y="205" width="650" height="165" rx="12" fill="#eef7f1" stroke="#3c8760" stroke-width="2"/>
    <text x="1405" y="245" text-anchor="middle" font-size="26" font-weight="bold">Shared MySQL 8.4</text>
    <text x="1405" y="280" text-anchor="middle" font-size="23">GP_Standard_D2ds_v4 · GeneralPurpose</text>
    <text x="1405" y="315" text-anchor="middle" font-size="23">ZoneRedundant · zones 1/2</text>
    <text x="1405" y="348" text-anchor="middle" font-size="21">10.10.3.0/24 · moodle_&lt;slug&gt; DB/user/grant</text>
    <path d="M540 285H620M980 285H1080" stroke="#526b84" stroke-width="4"/>
    <rect x="180" y="510" width="1550" height="260" rx="20" fill="#fff6e5" stroke="#c18a32" stroke-width="3"/>
    <text x="955" y="560" text-anchor="middle" font-size="27" font-weight="bold">Shared private dependencies</text>
    <text x="955" y="615" text-anchor="middle" font-size="23">Azure Files Premium NFSv4.1 · shared Moodle dataroot and primary backups</text>
    <text x="955" y="655" text-anchor="middle" font-size="23">Azure Blob LRS · UAMI / BlobFuse2 · replicated backups</text>
    <text x="955" y="695" text-anchor="middle" font-size="23">/readyz requires TLS MySQL SELECT 1 and all three exact mounts</text>
    <text x="955" y="900" text-anchor="middle" font-size="22">No Redis · legacy tenant MySQL subnet retained unused · DNS link appears after shared reconcile</text>
  </g>
</svg>
